name: Actualizar lista de Biblias

on:
  push:
    paths:
      - '**.json'
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas
  workflow_dispatch:         # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar biblias.json
        run: python3 actualizar_biblias.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add biblias.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar lista de Biblias"
            git push
          fi
