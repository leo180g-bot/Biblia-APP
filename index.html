<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblia (JSON de la carpeta)</title>
<style>
:root{--bg:#fbfaf7;--fg:#222;--mut:#777;--card:#fff;--bd:#e3e0d8;--acc:#8a4b16;--h1:#fff2a8;--h2:#c8f0c0;--h3:#bfe3ff;--h4:#ffc9dd;--fs:19px;--ff:Georgia,'Times New Roman',serif;--lh:1.7;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="sepia"]){--bg:#16171a;--fg:#e6e3dc;--mut:#9a9a9a;--card:#1f2024;--bd:#33353a;--acc:#e0a368;--h1:#5b4f10;--h2:#27502a;--h3:#1f4565;--h4:#612a42;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16171a;--fg:#e6e3dc;--mut:#9a9a9a;--card:#1f2024;--bd:#33353a;--acc:#e0a368;--h1:#5b4f10;--h2:#27502a;--h3:#1f4565;--h4:#612a42;color-scheme:dark}
:root[data-theme="sepia"]{--bg:#f4ecd8;--fg:#43342a;--mut:#8b7b66;--card:#fbf4e3;--bd:#ddd0b3}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
header{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--bd);background:var(--card);flex:none;overflow-x:auto}
header b{white-space:nowrap;color:var(--acc);margin-right:auto}
#app{flex:1;min-height:0;display:flex}
#side{width:270px;flex:none;overflow-y:auto;border-right:1px solid var(--bd);background:var(--card);padding:8px}
#side h4{margin:12px 6px 4px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
#side .bk{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px}
#side .bk.on{background:var(--bg);color:var(--acc);font-weight:600}
.cg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:4px 4px 8px}
.cg button{padding:5px 0;text-align:center}.cg .on{background:var(--acc);color:#fff;border-color:var(--acc)}
#main{flex:1;overflow-y:auto;padding:16px 18px 110px}
.rd{max-width:760px;margin:0 auto}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav h1{margin:0;font:600 24px var(--ff);text-align:center}
.sub{text-align:center;color:var(--mut);font-size:13px;margin-bottom:14px}
.v{font:var(--fs)/var(--lh) var(--ff);margin:0 0 .5em;padding:2px 6px;border-radius:6px;cursor:pointer}
.v sup{color:var(--acc);font:600 .6em system-ui;margin-right:5px}
.v.sel{outline:2px solid var(--acc)}
.v.h1{background:var(--h1)}.v.h2{background:var(--h2)}.v.h3{background:var(--h3)}.v.h4{background:var(--h4)}
.p2{display:block;color:var(--mut);font-size:.85em;margin-top:2px}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--bd);padding:8px;border-radius:14px;box-shadow:0 4px 18px #0004;z-index:8}
#bar[hidden]{display:none}
.dot{width:26px;height:26px;border-radius:50%;padding:0}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:14px;width:min(660px,92vw);max-height:82vh;padding:14px;overflow:auto}
dialog::backdrop{background:#0006}
.dh{text-align:right}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:4px 8px;text-align:left;white-space:nowrap}
pre{background:var(--bg);padding:10px;border-radius:8px;white-space:pre-wrap;word-break:break-word;font-size:12px}
input[type=text],input[type=search],textarea,select{width:100%;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
.r{display:block;width:100%;text-align:left;margin:4px 0}.r small{color:var(--mut);display:block}
mark{background:var(--h1);color:inherit}
.wel{max-width:560px;margin:8vh auto;text-align:center}
.drop{border:2px dashed var(--bd);border-radius:14px;padding:28px;margin:18px 0}
.ok{color:#2a8a3a}.bad{color:#c0392b}
#bar{flex-wrap:wrap;justify-content:center;max-width:94vw}
.hd{font:600 .8em system-ui;color:var(--acc);margin:1.2em 0 .5em;text-align:center;text-transform:uppercase;letter-spacing:.04em}
.lnk{display:inline-block;margin:4px 6px 0 0;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;color:var(--acc);text-decoration:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:20px;z-index:20}#toast[hidden]{display:none}
@media(max-width:760px){#side{position:fixed;left:0;top:calc(env(safe-area-inset-top,0px) + 46px);bottom:0;z-index:6;transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 12px #0003}#side.open{transform:none}}
</style>
</head>
<body>
<header>
<button data-a="menu" title="Libros">☰</button><b>📖 Biblia</b><select id="tsel" title="Traducción" style="width:auto;padding:5px"></select>
<button data-a="vod" title="Versículo del día">✨</button><button data-a="marks" title="Marcadores y notas">🔖</button><button data-a="search" title="Buscar">🔍</button><button data-a="par" title="Traducción paralela">⇆</button><button data-a="struct" title="Estructura del JSON">🧩</button><button data-a="set" title="Ajustes">Aa</button>
</header>
<div id="app"><nav id="side"></nav><main id="main"></main></div>
<div id="bar" hidden>
<button class="dot" style="background:var(--h1)" data-a="hl" data-c="1"></button><button class="dot" style="background:var(--h2)" data-a="hl" data-c="2"></button><button class="dot" style="background:var(--h3)" data-a="hl" data-c="3"></button><button class="dot" style="background:var(--h4)" data-a="hl" data-c="4"></button><button class="dot" data-a="hl" data-c="0" title="Quitar resaltado">∅</button>
<button data-a="bm" title="Marcador">🔖</button><button data-a="note" title="Nota">📝</button><button data-a="copy" title="Copiar">📋</button><button data-a="share" title="Compartir">📤</button><button data-a="all" title="Todo el capítulo">▣</button><button data-a="clr">✕</button>
</div>
<dialog id="d"></dialog><div id="toast" hidden></div>
<input type="file" id="file" webkitdirectory multiple hidden>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const nm=s=>strip(String(s)).replace(/^(iii|ii|i)\s+/,(m,r)=>({i:1,ii:2,iii:3}[r])).replace(/^(primer[ao]?|1st|first)\s+/,'1').replace(/^(segund[ao]|2nd|second)\s+/,'2').replace(/^(tercer[ao]?|3rd|third)\s+/,'3').replace(/(el\s+)?libro\s+de(l)?\s+|book\s+of\s+/g,'').replace(/[^a-z0-9]/g,'');
const BK=`Génesis|Genesis|gn,gen,ge
Éxodo|Exodus|ex,exo,exod
Levítico|Leviticus|lv,lev,le
Números|Numbers|nm,num,nu
Deuteronomio|Deuteronomy|dt,deut,de
Josué|Joshua|jos,josh
Jueces|Judges|jue,jdg,judg
Rut|Ruth|rt,rut,ru
1 Samuel|1 Samuel|1sam,1sa,1s
2 Samuel|2 Samuel|2sam,2sa,2s
1 Reyes|1 Kings|1re,1ki,1kgs,1r
2 Reyes|2 Kings|2re,2ki,2kgs,2r
1 Crónicas|1 Chronicles|1cr,1ch,1chr
2 Crónicas|2 Chronicles|2cr,2ch,2chr
Esdras|Ezra|esd,ezr
Nehemías|Nehemiah|neh,ne
Ester|Esther|est,es
Job|Job|jb
Salmos|Psalms|sal,salmo,ps,psa,pss
Proverbios|Proverbs|pr,prov,pro
Eclesiastés|Ecclesiastes|ec,ecl,eccl,qoh
Cantares|Song of Solomon|cnt,cant,sos,song,ca,cantardeloscantares,songofsongs
Isaías|Isaiah|is,isa
Jeremías|Jeremiah|jer,je
Lamentaciones|Lamentations|lam,la
Ezequiel|Ezekiel|ez,eze,ezek
Daniel|Daniel|dn,dan,da
Oseas|Hosea|os,hos
Joel|Joel|jl,joe
Amós|Amos|am,amo
Abdías|Obadiah|abd,oba,ob
Jonás|Jonah|jon,jnh
Miqueas|Micah|miq,mic
Nahúm|Nahum|nah,na
Habacuc|Habakkuk|hab,hb
Sofonías|Zephaniah|sof,zep,zeph
Hageo|Haggai|hag,hg
Zacarías|Zechariah|zac,zec,zech
Malaquías|Malachi|mal,ml
Mateo|Matthew|mt,mat,matt
Marcos|Mark|mr,mar,mc,mk
Lucas|Luke|lc,luc,lk,lu
Juan|John|jn,jhn,joh
Hechos|Acts|hch,hec,ac,act,hechosdelosapostoles
Romanos|Romans|ro,rom,rm
1 Corintios|1 Corinthians|1co,1cor
2 Corintios|2 Corinthians|2co,2cor
Gálatas|Galatians|ga,gal
Efesios|Ephesians|ef,eph,efe
Filipenses|Philippians|fil,php,phil
Colosenses|Colossians|col
1 Tesalonicenses|1 Thessalonians|1ts,1th,1tes,1thess
2 Tesalonicenses|2 Thessalonians|2ts,2th,2tes,2thess
1 Timoteo|1 Timothy|1ti,1tim
2 Timoteo|2 Timothy|2ti,2tim
Tito|Titus|tit,tt
Filemón|Philemon|flm,phm,film
Hebreos|Hebrews|heb,he
Santiago|James|stg,jas,sant,jm
1 Pedro|1 Peter|1pe,1pt,1ped,1pet
2 Pedro|2 Peter|2pe,2pt,2ped,2pet
1 Juan|1 John|1jn,1jo,1joh
2 Juan|2 John|2jn,2jo,2joh
3 Juan|3 John|3jn,3jo,3joh
Judas|Jude|jud,jd
Apocalipsis|Revelation|ap,apo,rev,re,revelacion,revelations`.split('\n').map(l=>{const[a,b,c]=l.split('|');return{es:a,en:b,ab:c.split(',')}});
const IDX={};BK.forEach((b,i)=>[b.es,b.en,...b.ab].forEach(k=>{k=nm(k);if(!(k in IDX))IDX[k]=i}));
function look(n){const k=nm(n);if(k in IDX)return IDX[k];if(k.length>3)for(const x in IDX)if(x.length>3&&(k.startsWith(x)||x.startsWith(k)))return IDX[x];return -1}

/* ---------- Detección de estructura ---------- */
const num=k=>parseInt(k,10),keys=o=>Object.keys(o).sort((a,b)=>num(a)-num(b)||a.localeCompare(b));
const cl=t=>String(t??'').replace(/<(?!\/?i>)[^>]+>/g,'').replace(/[ \t\r\f]+/g,' ').trim();
const fmt=t=>esc(t).replace(/&lt;(\/?)i&gt;/g,'<$1i>').replace(/\n/g,'<br>');
const pl=t=>String(t).replace(/<[^>]+>/g,'').replace(/\n/g,' ');
function verses(x){
 if(Array.isArray(x))return x.map((e,i)=>e&&typeof e=='object'?{n:e.verse??e.v??e.number??e.num??i+1,t:cl(e.text??e.t??e.content)}:{n:i+1,t:cl(e)});
 if(x&&typeof x=='object')return keys(x).map(k=>({n:k,t:cl(typeof x[k]=='object'?(x[k]?.text??x[k]?.t):x[k])}));
 return[]}
function chapters(x){
 if(Array.isArray(x))return x.map((e,i)=>{if(e&&!Array.isArray(e)&&typeof e=='object'){const m=String(e.usfm||e.human||'').match(/(\d+)$/);
  if(e.items)return{n:e.chapter??e.number??(m?+m[1]:i+1),v:fromItems(e.items)};
  if(e.verses||e.vs)return{n:e.chapter??e.number??e.c??i+1,v:verses(e.verses||e.vs)}}
  return{n:i+1,v:verses(e)}});
 if(x&&typeof x=='object')return keys(x).map(k=>({n:k,v:verses(x[k])}));
 return[]}
const USFM='GEN EXO LEV NUM DEU JOS JDG RUT 1SA 2SA 1KI 2KI 1CH 2CH EZR NEH EST JOB PSA PRO ECC SNG ISA JER LAM EZK DAN HOS JOL AMO OBA JON MIC NAM HAB ZEP HAG ZEC MAL MAT MRK LUK JHN ACT ROM 1CO 2CO GAL EPH PHP COL 1TH 2TH 1TI 2TI TIT PHM HEB JAS 1PE 2PE 1JN 2JN 3JN JUD REV'.split(' ');
function fromItems(items){const o=[];let h=[];
 items.forEach(it=>{const L=(it.lines||[]).map(cl).filter(Boolean),vn=it.verse_numbers||[];
  if(it.type=='verse'&&vn.length){const v={n:vn.length>1?vn[0]+'-'+vn[vn.length-1]:vn[0],t:L.join('\n')};
   if(h.length){v.h=h.join(' · ');h=[]}
   const p=o.find(x=>x.n==v.n);p?p.t+='\n'+v.t:o.push(v)}
  else if(L.length){if(/^selah$/i.test(L[0])&&o.length)o[o.length-1].t+='\n<i>'+L[0]+'</i>';else h.push(L.join(' '))}});
 return o}
const bookFrom=(e,i)=>({name:String(e.human??e.name??e.book??e.title??e.book_name??e.abbrev??e.n??'Libro '+(i+1)),usfm:e.usfm||'',ab:e.abbrev||e.abbreviation||'',ch:chapters(e.chapters??e.chapter??e.c)});
const gk=(o,ks)=>{for(const k of ks)if(o[k]!==undefined)return o[k]};
function flat(a,pre){
 const M=new Map();
 a.forEach(o=>{let b=gk(o,['book_name','bookName','book','book_id','bookId','b','book_number','bk']);
  if(/^\d+$/.test(b)&&b>=1&&b<=66)b=BK[b-1].es;
  const c=gk(o,['chapter','c','chapter_number','ch']),v=gk(o,['verse','v','verse_number','vs']),t=gk(o,['text','t','verse_text','content']);
  if(!M.has(b))M.set(b,{name:String(b),ab:'',m:new Map()});const bb=M.get(b).m;
  if(!bb.has(c))bb.set(c,[]);bb.get(c).push({n:v,t:cl(t)})});
 return{f:pre+'Lista plana de versículos [{libro, capítulo, versículo, texto}]',books:[...M.values()].map(b=>({name:b.name,ab:'',ch:[...b.m].map(([n,v])=>({n,v}))}))}}
function parse(d){
 if(Array.isArray(d)){
  const e=d[0];
  if(Array.isArray(e))return{f:'Matriz anidada [libro][capítulo][versículo]',books:d.map((c,i)=>({name:'Libro '+(i+1),ab:'',ch:chapters(c)}))};
  if(e&&typeof e=='object'){
   if(e.chapters!==undefined)return{f:'Lista de libros [{nombre, capítulos:[…]}]',books:d.map(bookFrom)};
   return flat(d,'')}
  throw new Error('Arreglo vacío o no reconocido.')}
 if(d&&typeof d=='object'){
  if(Array.isArray(d.verses))return flat(d.verses,'Contenedor “verses” → ');
  const k=['books','bible','Bible','data','content','testaments'].find(k=>d[k]&&typeof d[k]=='object');
  if(k){const r=parse(d[k]);r.f='Contenedor “'+k+'” → '+r.f;return r}
  const ks=Object.keys(d),m=/^(.+?)\s+(\d+):(\d+)$/;
  if(ks.length&&m.test(ks[0]))return flat(ks.map(x=>{const r=x.match(m);return r?{book:r[1],chapter:+r[2],verse:+r[3],text:d[x]}:null}).filter(Boolean),'Claves “Libro cap:ver” → ');
  const bs=ks.filter(x=>d[x]&&typeof d[x]=='object').map((x,i)=>{const c=d[x];return c.chapters!==undefined&&!Array.isArray(c)?{...bookFrom(c,i),name:x}:{name:x,ab:'',ch:chapters(c)}});
  return{f:'Objeto {libro: capítulos → versículos}',books:bs}}
 throw new Error('El JSON no tiene una estructura reconocible.')}
function sk(x,d=0){if(Array.isArray(x))return d>3?'[…]':'['+(x.length?sk(x[0],d+1):'')+', … ×'+x.length+']';
 if(x&&typeof x=='object'){const k=Object.keys(x);if(d>3)return'{…}';return'{'+k.slice(0,4).map(a=>JSON.stringify(a)+': '+sk(x[a],d+1)).join(', ')+(k.length>4?', … +'+(k.length-4):'')+'}'}
 return typeof x=='string'?JSON.stringify(x.length>24?x.slice(0,24)+'…':x):String(x)}
function build(d,name){
 const r=parse(d),bs=r.books.filter(b=>b.ch.length&&b.ch.some(c=>c.v.length));
 if(!bs.length)throw new Error('No se encontraron libros con capítulos y versículos.');
 bs.forEach(b=>{const u=b.usfm?USFM.indexOf(b.usfm.toUpperCase()):-1;b.id=u>=0?u:look(b.name);if(b.id<0&&b.ab)b.id=look(b.ab)});
 if(bs.length==66)bs.forEach((b,i)=>{if(b.id<0)b.id=i});
 bs.forEach(b=>{b.disp=b.usfm?b.name:(b.id>=0?BK[b.id].es:b.name);b.key=b.id>=0?b.id:b.name;b.nv=b.ch.reduce((a,c)=>a+c.v.length,0)});
 bs.sort((a,b)=>(a.id<0?999:a.id)-(b.id<0?999:b.id));
 return{name,books:bs,f:r.f,ok:bs.filter(b=>b.id>=0).length,nv:bs.reduce((a,b)=>a+b.nv,0),nc:bs.reduce((a,b)=>a+b.ch.length,0),sk:sk(d)}}

/* ---------- Estado y persistencia ---------- */
const ls={g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={tr:null,tr2:null,bi:0,ci:0,sel:new Set(),pm:0,m:ls.g('bib:marks',{}),set:ls.g('bib:set',{fs:19,ff:'serif',th:'auto',lh:1.7})};
function applySet(){const r=document.documentElement,s=S.set;
 r.style.setProperty('--fs',s.fs+'px');r.style.setProperty('--lh',s.lh);
 r.style.setProperty('--ff',s.ff=='sans'?'system-ui,-apple-system,sans-serif':"Georgia,'Times New Roman',serif");
 s.th=='auto'?r.removeAttribute('data-theme'):r.dataset.theme=s.th;ls.s('bib:set',s)}
const mk=(b,c,v)=>b.key+':'+c.n+':'+v.n;
const saveM=()=>{for(const k in S.m){const m=S.m[k];if(!m.h&&!m.bm&&!m.note)delete S.m[k]}ls.s('bib:marks',S.m)};

/* ---------- Carga ---------- */
const SAMPLE={translation:'Ejemplo (Reina-Valera 1909, extracto)',books:[
{name:'Génesis',chapters:[{chapter:1,verses:[{verse:1,text:'En el principio crió Dios los cielos y la tierra.'},{verse:2,text:'Y la tierra estaba desordenada y vacía, y las tinieblas estaban sobre la haz del abismo, y el Espíritu de Dios se movía sobre la haz de las aguas.'},{verse:3,text:'Y dijo Dios: Sea la luz: y fué la luz.'}]}]},
{name:'Salmos',chapters:[{chapter:23,verses:[{verse:1,text:'Jehová es mi pastor; nada me faltará.'}]}]},
{name:'Juan',chapters:[{chapter:3,verses:[{verse:16,text:'Porque de tal manera amó Dios al mundo, que ha dado á su Hijo unigénito, para que todo aquel que en él cree, no se pierda, mas tenga vida eterna.'}]}]}]};
S.trs=[];
const addTr=t=>{const i=S.trs.findIndex(x=>x.name==t.name);i>=0?S.trs[i]=t:S.trs.push(t)};
function tsel(){$('#tsel').innerHTML=S.trs.map((t,i)=>`<option value="${i}"${t===S.tr?' selected':''}>${esc(t.name)}</option>`).join('')}
const savePos=()=>{const t=S.tr,b=t.books[S.bi];ls.s('bib:pos2',{t:t.name,k:b.key,c:b.ch[S.ci].n})};
function useTr(i){const t=S.trs[i];if(!t)return;
 const c=S.tr?{k:S.tr.books[S.bi].key,c:S.tr.books[S.bi].ch[S.ci].n}:ls.g('bib:pos2',null);
 S.tr=t;if(S.tr2===t)S.tr2=null;S.bi=0;S.ci=0;
 if(c){const bi=t.books.findIndex(b=>String(b.key)==String(c.k));if(bi>=0){S.bi=bi;const ci=t.books[bi].ch.findIndex(x=>String(x.n)==String(c.c));S.ci=ci>=0?ci:0}}
 tsel();side();main();savePos()}
function load(d,fname,par,opt){
 const o=opt||{};
 const name=o.name||(d&&!Array.isArray(d)&&typeof d=='object'&&(d.translation||d.local_abbreviation||d.name||d.version||d.title))||fname.replace(/\.json$/i,'');
 const t=build(d,String(name));if(o.title)t.title=o.title;if(o.copy)t.copy=o.copy;if(o.sk)t.sk=o.sk;if(o.f)t.f=o.f;
 addTr(t);if(o.quiet)return;
 if(par){S.tr2=t;tsel();main();return}
 useTr(S.trs.indexOf(t))}
function readFile(f,par){f.text().then(x=>{try{load(JSON.parse(x),f.name,par)}catch(e){alert('No se pudo leer el archivo: '+e.message)}})}
async function unz(id){const b=atob($('#'+id).textContent.trim()),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
 return new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).json()}

/* ---------- Vistas ---------- */
function side(){
 const t=S.tr,el=$('#side');if(!t){el.innerHTML='<p style="color:var(--mut);padding:8px">Abre un archivo JSON para ver los libros.</p>';return}
 let h='',last='';
 t.books.forEach((b,i)=>{const g=b.id<0?'Otros':b.id<39?'Antiguo Testamento':'Nuevo Testamento';
  if(g!=last){h+=`<h4>${g}</h4>`;last=g}
  h+=`<button class="bk${i==S.bi?' on':''}" data-a="book" data-b="${i}">${esc(b.disp)}</button>`;
  if(i==S.bi)h+='<div class="cg">'+b.ch.map((c,j)=>`<button class="${j==S.ci?'on':''}" data-a="chap" data-c="${j}">${esc(c.n)}</button>`).join('')+'</div>'});
 el.innerHTML=h}
function par(b,c){if(!S.tr2)return null;const b2=S.tr2.books.find(x=>String(x.key)==String(b.key)),c2=b2&&b2.ch.find(x=>String(x.n)==String(c.n));if(!c2)return{};const o={};c2.v.forEach(v=>o[v.n]=v.t);return o}
function main(){
 const m=$('#main'),t=S.tr;
 if(!t&&S.ld){m.innerHTML='<p class="wel">Cargando Biblias…</p>';return}
 if(!t){m.innerHTML=`<div class="wel"><h1>Biblia</h1><p>No encontré archivos JSON de Biblia junto a esta página.</p><p>Guarda los .json en la misma carpeta que este HTML y ábrelo desde un servidor local, porque los navegadores no permiten leer carpetas desde un archivo abierto con doble clic. En la carpeta ejecuta:</p><pre>python -m http.server 8000</pre><p>y entra a <b>http://localhost:8000/</b> y abre este archivo.</p><p style="color:var(--mut)">Si no puedes usar un servidor: <button data-a="open">Seleccionar la carpeta</button></p></div>`;return}
 const b=t.books[S.bi],c=b.ch[S.ci],p2=par(b,c);
 let h=`<div class="rd"><div class="nav"><button data-a="prev">‹</button><h1>${esc(b.disp)} ${esc(c.n)}</h1><button data-a="next">›</button></div><div class="sub">${esc(t.name)}${S.tr2?' · '+esc(S.tr2.name):''}</div>`;
 c.v.forEach(v=>{const mm=S.m[mk(b,c,v)]||{};
  h+=(v.h?`<h3 class="hd">${esc(v.h)}</h3>`:'')+`<p class="v${S.sel.has(String(v.n))?' sel':''}${mm.h?' h'+mm.h:''}" data-n="${esc(v.n)}"><sup>${esc(v.n)}</sup>${fmt(v.t)}${mm.bm?' 🔖':''}${mm.note?' 📝':''}${p2?`<span class="p2">${fmt(p2[v.n]||'—')}</span>`:''}</p>`});
 m.innerHTML=h+'</div>';$('#bar').hidden=!S.sel.size}
function go(bi,ci,vn){const t=S.tr;if(!t)return;
 if(bi<0||bi>=t.books.length)return;S.bi=bi;S.ci=Math.max(0,Math.min(ci,t.books[bi].ch.length-1));S.sel.clear();
 if(vn!=null)S.sel.add(String(vn));
 savePos();side();main();$('#side').classList.remove('open');
 const e=vn!=null&&$(`.v[data-n="${vn}"]`);e?e.scrollIntoView({block:'center'}):$('#main').scrollTo(0,0)}
function step(d){const t=S.tr;if(!t)return;let b=S.bi,c=S.ci+d;
 if(c<0){if(b==0)return;b--;c=t.books[b].ch.length-1}else if(c>=t.books[b].ch.length){if(b==t.books.length-1)return;b++;c=0}go(b,c)}

/* ---------- Diálogos ---------- */
const D=$('#d');
function dlg(h){D.innerHTML='<div class="dh"><button data-a="close">✕</button></div>'+h;if(!D.open)D.showModal()}
function struct(){const t=S.tr;if(!t)return dlg('<p>Aún no hay un archivo cargado.</p>');
 dlg(`<h3>Estructura detectada</h3><p><b>Traducción:</b> ${esc(t.name)}${t.title?' — '+esc(t.title):''}<br>${t.copy?'<small>'+esc(t.copy)+'</small><br>':''}<b>Formato:</b> ${esc(t.f)}<br><b>Libros:</b> ${t.books.length} (<span class="${t.ok==t.books.length?'ok':'bad'}">${t.ok} identificados</span>) · <b>Capítulos:</b> ${t.nc} · <b>Versículos:</b> ${t.nv}</p>
 <div class="tbl"><table><tr><th>#</th><th>Nombre en el archivo</th><th>Identificado como</th><th>Cap.</th><th>Vers.</th></tr>${t.books.map((b,i)=>`<tr><td>${b.id>=0?b.id+1:'–'}</td><td>${esc(b.name)}</td><td>${b.id>=0?esc(BK[b.id].es+' / '+BK[b.id].en):'<span class="bad">sin identificar</span>'}</td><td>${b.ch.length}</td><td>${b.nv}</td></tr>`).join('')}</table></div>
 <h4>Esqueleto del JSON</h4><pre>${esc(t.sk)}</pre>`)}
function settings(){const s=S.set;
 dlg(`<h3>Ajustes de lectura</h3><label>Tamaño de letra: <b id="fsv">${s.fs}</b></label><input type="range" min="14" max="34" value="${s.fs}" oninput="S.set.fs=+this.value;$('#fsv').textContent=this.value;applySet()">
 <label>Interlineado</label><input type="range" min="1.3" max="2.2" step=".1" value="${s.lh}" oninput="S.set.lh=+this.value;applySet()">
 <label>Fuente</label><select onchange="S.set.ff=this.value;applySet()"><option value="serif"${s.ff=='serif'?' selected':''}>Con serifa</option><option value="sans"${s.ff=='sans'?' selected':''}>Sin serifa</option></select>
 <label>Tema</label><select onchange="S.set.th=this.value;applySet()">${[['auto','Automático'],['light','Claro'],['dark','Oscuro'],['sepia','Sepia']].map(([v,l])=>`<option value="${v}"${s.th==v?' selected':''}>${l}</option>`).join('')}</select>
 ${S.tr2?'<p><button data-a="rmpar">Quitar traducción paralela</button></p>':''}`)}
function searchDlg(){dlg(`<h3>Buscar</h3><input type="search" id="q" placeholder="Palabra, frase o referencia (Juan 3:16)"><div id="res"></div>`);const q=$('#q');q.focus();q.onkeydown=e=>{if(e.key=='Enter')runSearch(q.value)}}
function runSearch(q){const t=S.tr,R=$('#res');q=q.trim();if(!t||!q)return;
 const r=q.match(/^(.+?)\s+(\d+)(?::(\d+))?$/);
 if(r){const id=look(r[1]),bi=t.books.findIndex(b=>b.id==id&&id>=0);
  if(bi>=0){const ci=t.books[bi].ch.findIndex(c=>String(c.n)==r[2]);if(ci>=0){D.close();return go(bi,ci,r[3])}}}
 if(!t.idx){t.idx=[];t.books.forEach((b,bi)=>b.ch.forEach((c,ci)=>c.v.forEach((v,vi)=>t.idx.push([bi,ci,vi,strip(pl(v.t))]))))}
 const w=strip(q).split(/\s+/).filter(Boolean);let out='',n=0;
 for(const[bi,ci,vi,s]of t.idx){if(!w.every(x=>s.includes(x)))continue;
  const b=t.books[bi],c=b.ch[ci],v=c.v[vi];const P=pl(v.t);let tx=esc(P);
  if(P.length==s.length){const re=new RegExp(w.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g'),rg=[];let m;while(m=re.exec(s))rg.push([m.index,m.index+m[0].length]);
   tx=rg.reduceRight((a,[x,y])=>a.slice(0,x)+'§'+a.slice(x,y)+'¶'+a.slice(y),P);tx=esc(tx).replace(/§/g,'<mark>').replace(/¶/g,'</mark>')}
  out+=`<button class="r" data-a="goref" data-b="${bi}" data-c="${ci}" data-v="${esc(v.n)}"><b>${esc(b.disp)} ${esc(c.n)}:${esc(v.n)}</b><small>${tx}</small></button>`;
  if(++n>=300)break}
 R.innerHTML=`<p style="color:var(--mut)">${n>=300?'Mostrando los primeros 300 resultados':n+' resultado(s)'}</p>`+out}
function marksDlg(){const t=S.tr;if(!t)return dlg('<p>Abre una Biblia primero.</p>');let out='';
 for(const k in S.m){const r=k.match(/^(.*):([^:]+):([^:]+)$/);if(!r)continue;const bi=t.books.findIndex(b=>String(b.key)==r[1]);if(bi<0)continue;
  const b=t.books[bi],ci=b.ch.findIndex(c=>String(c.n)==r[2]),v=ci>=0&&b.ch[ci].v.find(x=>String(x.n)==r[3]);if(!v)continue;const m=S.m[k];
  out+=`<button class="r" data-a="goref" data-b="${bi}" data-c="${ci}" data-v="${esc(v.n)}"><b>${esc(b.disp)} ${esc(r[2])}:${esc(r[3])}</b> ${m.bm?'🔖':''}${m.h?' <span class="v h'+m.h+'" style="padding:0 6px">●</span>':''}<small>${m.note?'📝 '+esc(m.note)+'<br>':''}${esc(pl(v.t))}</small></button>`}
 dlg('<h3>Marcadores, resaltados y notas</h3>'+(out||'<p style="color:var(--mut)">Aún no tienes nada guardado. Toca un versículo para seleccionarlo.</p>'))}
function vod(){const t=S.tr;if(!t)return dlg('<p>Abre una Biblia primero.</p>');
 let i=((Math.floor(Date.now()/864e5)*7919)%t.nv);
 for(let bi=0;bi<t.books.length;bi++){const b=t.books[bi];if(i>=b.nv){i-=b.nv;continue}
  for(let ci=0;ci<b.ch.length;ci++){const c=b.ch[ci];if(i>=c.v.length){i-=c.v.length;continue}const v=c.v[i];
   return dlg(`<h3>✨ Versículo del día</h3><p style="font:var(--fs)/1.6 var(--ff)">“${esc(pl(v.t))}”</p><p><b>${esc(b.disp)} ${esc(c.n)}:${esc(v.n)}</b></p><button data-a="goref" data-b="${bi}" data-c="${ci}" data-v="${esc(v.n)}">Leer en contexto</button>`)}}}

/* ---------- Selección y acciones ---------- */
const sels=()=>{const t=S.tr,b=t.books[S.bi],c=b.ch[S.ci];return c.v.filter(v=>S.sel.has(String(v.n))).map(v=>({v,k:mk(b,c,v)}))};
function range(a){const n=a.map(x=>+x.v.n);if(n.some(isNaN))return a.map(x=>x.v.n).join(', ');
 const o=[];let s=n[0],p=n[0];for(let i=1;i<=n.length;i++){if(n[i]==p+1){p=n[i];continue}o.push(s==p?s:s+'-'+p);s=p=n[i]}return o.join(', ')}
function selText(){const t=S.tr,b=t.books[S.bi],c=b.ch[S.ci],s=sels(),ref=`${b.disp} ${c.n}:${range(s)}`;
 const body=s.length==1?'“'+pl(s[0].v.t)+'”':s.map(({v})=>v.n+' '+pl(v.t)).join('\n');return{ref,tx:`${body}\n— ${ref} (${t.name})`}}
function copyTx(tx){return(navigator.clipboard?navigator.clipboard.writeText(tx):Promise.reject()).catch(()=>{const z=document.createElement('textarea');z.value=tx;document.body.appendChild(z);z.select();try{document.execCommand('copy')}catch(e){}z.remove()}).then(()=>toast('Copiado'))}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,1800)}
function act(a,el){const d=el.dataset;switch(a){
 case'open':S.pm=0;$('#file').click();break;
 case'par':if(!S.tr)return;dlg(`<h3>Traducción paralela</h3>${S.trs.filter(t=>t!==S.tr).map(t=>`<button class="r" data-a="setpar" data-i="${S.trs.indexOf(t)}">${esc(t.name)}${t.title?' — '+esc(t.title):''}</button>`).join('')}${S.tr2?'<button class="r" data-a="rmpar">Quitar traducción paralela</button>':''}`);break;
 case'setpar':D.close();S.tr2=S.trs[+d.i];main();break;
 case'parfile':D.close();S.pm=1;$('#file').click();break;
 case'ex':load(SAMPLE,'ejemplo.json',0,2);break;
 case'menu':$('#side').classList.toggle('open');break;
 case'book':go(+d.b,0);break;case'chap':go(S.bi,+d.c);break;
 case'prev':step(-1);break;case'next':step(1);break;
 case'struct':struct();break;case'set':settings();break;case'search':searchDlg();break;case'marks':marksDlg();break;case'vod':vod();break;
 case'close':D.close();break;
 case'goref':D.close();go(+d.b,+d.c,d.v);break;
 case'rmpar':S.tr2=null;D.close();main();break;
 case'hl':sels().forEach(({k})=>{S.m[k]=S.m[k]||{};S.m[k].h=+d.c||0});saveM();S.sel.clear();main();break;
 case'bm':{const s=sels(),all=s.every(({k})=>S.m[k]?.bm);s.forEach(({k})=>{S.m[k]=S.m[k]||{};S.m[k].bm=!all});saveM();S.sel.clear();main();break}
 case'note':{const s=sels();dlg(`<h3>Nota</h3><textarea id="nt" rows="5">${esc(S.m[s[0].k]?.note||'')}</textarea><p><button data-a="savenote">Guardar</button></p>`);break}
 case'savenote':{const x=$('#nt').value.trim();sels().forEach(({k})=>{S.m[k]=S.m[k]||{};S.m[k].note=x});saveM();D.close();S.sel.clear();main();break}
 case'copy':copyTx(selText().tx);S.sel.clear();main();break;
 case'share':{const x=selText();dlg(`<h3>Compartir</h3><pre>${esc(x.tx)}</pre><p><button data-a="doshare">📤 Compartir…</button> <button data-a="copy2">📋 Copiar</button></p><p><a class="lnk" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(x.tx)}">WhatsApp</a><a class="lnk" target="_blank" rel="noopener" href="https://t.me/share/url?url=%20&text=${encodeURIComponent(x.tx)}">Telegram</a><a class="lnk" href="mailto:?subject=${encodeURIComponent(x.ref)}&body=${encodeURIComponent(x.tx)}">Correo</a></p>`);break}
 case'doshare':{const x=selText();navigator.share?navigator.share({text:x.tx}).catch(e=>{if(e.name!='AbortError')copyTx(x.tx)}):copyTx(x.tx);break}
 case'copy2':copyTx(selText().tx);break;
 case'all':S.tr.books[S.bi].ch[S.ci].v.forEach(v=>S.sel.add(String(v.n)));main();break;
 case'clr':S.sel.clear();main();break}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t)return act(t.dataset.a,t);
 const v=e.target.closest('.v');if(v&&!String(getSelection()).length){const n=v.dataset.n;S.sel.has(n)?S.sel.delete(n):S.sel.add(n);main()}});
document.addEventListener('keydown',e=>{if(D.open||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key=='ArrowRight')step(1);if(e.key=='ArrowLeft')step(-1)});
$('#file').onchange=async e=>{let n=0;for(const f of e.target.files){if(!/\.json$/i.test(f.name))continue;try{load(JSON.parse(await f.text()),f.name,0,{quiet:1});n++}catch(x){}}e.target.value='';if(n){S.ld=0;useTr(0)}else alert('No se encontraron Biblias JSON en esa carpeta.')};
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>e.preventDefault());

applySet();S.ld=1;side();main();$('#tsel').onchange=e=>useTr(+e.target.value);
async function scan(){let n=[];
 try{const r=await fetch('biblias.json');if(r.ok)n=(await r.json()).map(x=>x.file||x)}catch(e){}
 if(!n.length)try{const r=await fetch('./'),t=await r.text();n=[...t.matchAll(/href="([^"#?]+)"/g)].map(m=>{try{return decodeURIComponent(m[1])}catch(e){return m[1]}}).filter(h=>/\.json$/i.test(h)).map(h=>h.split('/').pop())}catch(e){}
 if(!n.length)n=['RVR1960.json','RVSBT18.json'];
 return[...new Set(n)].filter(x=>!/^biblias\.json$/i.test(x))}
(async()=>{let c=0;for(const f of await scan()){try{const r=await fetch(encodeURI(f));if(!r.ok)continue;load(await r.json(),f,0,{quiet:1});c++}catch(e){}}
 S.ld=0;if(c){const p=ls.g('bib:pos2',null);useTr(Math.max(0,S.trs.findIndex(x=>x.name==(p&&p.t))))}else main()})();
</script>
</body>
</html>
